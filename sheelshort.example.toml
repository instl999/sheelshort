# Copy to sheelshort.toml (gitignored) and set the servers. A project's own projects/<name>/sheelshort.toml can
# override any key. SHEELSHORT_SERVERS="url1,url2" overrides the server list.

[comfy]
servers = ["https://your-comfyui-server-1:8443", "https://your-comfyui-server-2:8443"]
auth_header_env = ""            # e.g. "COMFY_TOKEN" if a server needs a Bearer token
in_flight = 2                   # jobs per server at once (one running, one queued); the rest wait locally

[workflows]
t2i = "c01.api.json"            # C01 Z-Image: close-ups, props, location plates
edit = "y01.api.json"           # Y01 Qwen-Image-Edit 2511: three-view sheets, repairs
voice_design = "n06design.api.json"   # N06 Qwen3-TTS voice design: cast voices from a timbre description
h3_ref = "u22_base.api.json"    # U22: H3 reference-to-video, H3 speaks the lines itself (dialogue = "h3")
h3_drive = "u24_stock.api.json" # U24's T8 chain: the picture rendered around the acted dialogue track (dialogue = "acted")

[project]
language = "zh-CN"
seed_offset = 0                 # change to re-roll every generation

[images]
portrait_size = [720, 1280]
plate_size = [720, 1280]
prop_size = [1024, 1024]
sheet_long_side = 1664

[qc]
# Casting vision check: the servers' VLM compares each close-up and sheet with the bible (age, sex, identity anchors,
# three matching views) and failing images are regenerated with a new seed, at most `attempts` times.
enabled = true
attempts = 3
vlm_model = "Qwen3.8-27B-Q4_K_M.gguf"
vlm_mmproj = "Qwen3.8-mmproj-BF16.gguf"
vlm_chat_handler = "Qwen3.8"
# Clip QC (clipqc.py): every rendered clip is checked (lines heard, on-screen text, day/night, wrong person, glitches);
# a clip with problems is re-rendered with a new seed up to `max_takes`, and the best take goes into the episode.
clips = true
max_takes = 2
max_line_cer = 0.35
clip_vision = true
clip_vlm_model = "Qwen3-VL-8B-Instruct-abliterated-v2.0.Q8_0.gguf"
clip_vlm_mmproj = "Qwen3-VL-8B-Instruct-abliterated-v2.0.mmproj-Q8_0.gguf"
clip_vlm_chat_handler = "Qwen3-VL"

[perform]
# Performance first: every line is acted by a speech engine in the character's cast voice, several takes are scored
# (words, voice identity, expressiveness) and the best becomes the dialogue the picture is rendered to.
takes = 4                        # Drama 3 takes per line
max_cer = 0.25                   # reject takes whose words drift further from the line (ASR character error rate)
pitch_band = [0.8, 1.22]         # median pitch / cast voice median: identity guard for calm lines
pitch_band_intense = [0.8, 1.6]    # ... for crying, shouting, fear, pleading (real shouting lifts pitch a lot)
lead_s = 0.35                    # silence before a line inside its cut
tail_s = 0.45                    # breath after a line before the cut ends
whisper_model = "medium"

[render]
dialogue = "h3"                  # "h3" (default, owner verdict 2026-10-31): H3 voices the lines from the cast voice references; "acted": render to the performed track (lip-sync)
voice_ref = "cast"               # dialogue = "h3": "cast" = the cast voice clip; "acted" = acted Drama 3 takes of the clip's lines (run `perform` first)
takes = 1
megapixels = 0.52                # first pass; drive mode upscales 2x in latent space (~1088x1984)
upscale = 2.0
lock_strength = 0.35
h3_megapixels = 0.7              # dialogue = "h3" (U22)
timeout_s = 3600

[edit]
width = 1080
height = 1920
fps = 30
loudness = -11                   # LUFS integrated: the reference hits master at -10 to -15 (median -10.5)
grade = "auto"                   # finishing grade: "auto" follows the bible's look_preset; "film", "bright", "glossy", "none"
location_cards = true            # a vertical title with the place's name_zh as each new scene opens
upscale = "rtx"                  # "rtx": NVIDIA RTX Video Super Resolution on the servers to 1080x1920; "" = plain resize
font = "Heiti SC"            # libass family name; must have CJK glyphs
music = "auto"                   # "auto": ACE-Step bed from the episode's `music` tags; a file path; or "" for none

[fleet]
# AutoDL.Art app instances as on-demand ComfyUI servers (sheelshort/fleet.py). Instances listed in `core` are powered
# on when a command first needs a GPU and powered off once no sheelshort run uses them and their queue has been empty
# for `idle_off_minutes` (a background watcher does it after the command ends, so back-to-back commands find them
# warm). While a render runs, more servers are powered on (core first, then `name_prefix`-N ones) or created when
# clips are waiting, and powered off when idle and at the end of the run. Only core instances and ones named
# `name_prefix`-N in `region_names` are ever touched; an address of a core server need not be in [comfy] servers.
# Token: $AUTODL_TOKEN or ~/.config/sheelshort/autodl_token. Start with dry_run = true (decisions are only logged).
enabled = false
dry_run = true
application_uuid = "spcwDDc6XW"      # MINIMAX-H3提速500高画质
application_version = "9.48"         # pinned: the version the workflows were validated against
gpu_specs = ["5090-p"]               # tried in order when creating (e.g. add "pro6000-p" as a fallback)
data_centers = ["beijingDC2"]        # Beijing B only (the Northwest region is not reachable from this network)
region_names = ["北京"]
name_prefix = "sheelshort-bj"
core = []   # your own instances (uuid), powered on and off on demand; [] = [comfy] servers stay on
min_servers = 1                      # servers a command wakes before its first GPU job
max_servers = 4                      # at most this many servers in all
# Scale up when one more server saves at least `min_gain_minutes`: with n servers, W = clips left x clip_minutes and
# startup S, the saving is (W - n*S) / (n*(n+1)). S is updated from each real scale-up.
min_gain_minutes = 3
clip_minutes = 5                     # GPU minutes per clip (measured median ~5 on RTX 5090)
startup_minutes = 5                  # boot + ComfyUI + H3's first model load on a fresh server
idle_off_minutes = 10
retry_minutes = 5                    # after "no stock" or a failed start
tick_s = 20
